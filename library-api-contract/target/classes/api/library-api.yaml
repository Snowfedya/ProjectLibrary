openapi: 3.0.3
info:
  title: Library Management System API
  description: |-
    A comprehensive REST API for managing a modern educational library system.
    This API provides endpoints for book and user management, a borrowing system,
    teacher-specific features like reading lists and student supervision,
    notifications, and system statistics.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server
tags:
  - name: Authentication
    description: User authentication and registration
  - name: Books
    description: Book management and search
  - name: Users
    description: User profile and role management
  - name: Borrows
    description: Borrowing, returning, and renewing books
  - name: Reading Lists
    description: Teacher-managed reading lists
  - name: Groups
    description: Teacher-supervised student groups
  - name: Notifications
    description: User notifications
  - name: Statistics
    description: System statistics for librarians

paths:
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: User self-registration
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/books:
    get:
      tags:
        - Books
      summary: Search and filter books
      operationId: searchBooks
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Full-text search query
          schema:
            type: string
        - name: genre
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: subject
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Subject'
        - name: educationalLevel
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EducationalLevel'
        - name: availableOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Books
      summary: Create a new book
      operationId: createBook
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/books/{id}:
    get:
      tags:
        - Books
      summary: Get book by ID
      operationId: getBookById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Books
      summary: Update a book
      operationId: updateBook
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '200':
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Books
      summary: Delete a book
      operationId: deleteBook
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/books/{id}/cover:
    post:
      tags:
        - Books
      summary: Upload a book cover image
      operationId: uploadBookCover
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Cover uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  coverImageUrl:
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getAllUsers
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Users
      summary: Update user profile
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: User deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/role:
    put:
      tags:
        - Users
      summary: Change user role
      operationId: changeUserRole
      security:
        - bearerAuth: [ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/borrow-history:
    get:
      tags:
        - Users
      summary: Get user borrow history
      operationId: getUserBorrowHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of borrow records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BorrowRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{teacherId}/supervised-students:
    get:
      tags:
        - Users
      summary: Get supervised students for a teacher
      operationId: getSupervisedStudents
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/borrows:
    get:
      tags:
        - Borrows
      summary: Get borrow records
      operationId: getBorrows
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of borrow records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BorrowRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Borrows
      summary: Borrow a book
      operationId: borrowBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Book borrowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/borrows/{id}/return:
    put:
      tags:
        - Borrows
      summary: Return a borrowed book
      operationId: returnBook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/borrows/{id}/renew:
    put:
      tags:
        - Borrows
      summary: Renew a borrowed book
      operationId: renewBook
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book renewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/borrows/overdue:
    get:
      tags:
        - Borrows
      summary: Get overdue borrow records
      operationId: getOverdueBorrows
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      responses:
        '200':
          description: A list of overdue borrow records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BorrowRecord'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/borrows/by-user/{userId}:
    get:
      tags:
        - Borrows
      summary: Get borrow records by user ID
      operationId: getBorrowsByUserId
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of borrow records for the specified user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BorrowRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reading-lists:
    get:
      tags:
        - Reading Lists
      summary: Get reading lists
      operationId: getReadingLists
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      responses:
        '200':
          description: A list of reading lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Reading Lists
      summary: Create a reading list
      operationId: createReadingList
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingList'
      responses:
        '201':
          description: Reading list created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingList'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/reading-lists/{id}:
    put:
      tags:
        - Reading Lists
      summary: Update a reading list
      operationId: updateReadingList
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingList'
      responses:
        '200':
          description: Reading list updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Reading Lists
      summary: Delete a reading list
      operationId: deleteReadingList
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Reading list deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reading-lists/{id}/books:
    get:
      tags:
        - Reading Lists
      summary: Get books in a reading list
      operationId: getBooksInReadingList
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups:
    post:
      tags:
        - Groups
      summary: Create a student group
      operationId: createGroup
      security:
        - bearerAuth: [TEACHER, LIBRARIAN, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroup'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      operationId: getNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark a notification as read
      operationId: markNotificationAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Notification marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/statistics/books:
    get:
      tags:
        - Statistics
      summary: Get book statistics
      operationId: getBookStatistics
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      responses:
        '200':
          description: Book statistics
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/statistics/users:
    get:
      tags:
        - Statistics
      summary: Get user statistics
      operationId: getUserStatistics
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      responses:
        '200':
          description: User statistics
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/statistics/overdue-summary:
    get:
      tags:
        - Statistics
      summary: Get overdue summary
      operationId: getOverdueSummary
      security:
        - bearerAuth: [LIBRARIAN, ADMIN]
      responses:
        '200':
          description: Overdue summary
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z0-9_]{3,50}$"
        email:
          type: string
          format: email
        password:
          type: string
        fullName:
          type: string
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    Book:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        isbn13:
          type: string
          pattern: "^978[0-9]{10}$"
        isbn10:
          type: string
          pattern: "^[0-9]{9}[0-9X]$"
        genre:
          type: string
        publicationYear:
          type: integer
        quantity:
          type: integer
        availableQuantity:
          type: integer
        description:
          type: string
        coverImageUrl:
          type: string
          format: uri
        publisher:
          type: string
        language:
          type: string
        pagesCount:
          type: integer
        educationalLevel:
          $ref: '#/components/schemas/EducationalLevel'
        subject:
          $ref: '#/components/schemas/Subject'
    BookPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        pageable:
          type: object
        totalPages:
          type: integer
        totalElements:
          type: integer
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        educationalInstitution:
          type: string
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
    UserPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pageable:
          type: object
        totalPages:
          type: integer
        totalElements:
          type: integer
    BorrowRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        borrowDate:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
        renewed:
          type: boolean
        fineAmount:
          type: integer
    ReadingList:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teacherId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        subject:
          $ref: '#/components/schemas/Subject'
        educationalLevel:
          $ref: '#/components/schemas/EducationalLevel'
        academicYear:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
    UserGroup:
      type: object
      properties:
        id:
          type: integer
          format: int64
        teacherId:
          type: integer
          format: int64
        name:
          type: string
        students:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        message:
          type: string
        type:
