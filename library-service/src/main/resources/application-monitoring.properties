# Library Monitoring Configuration
# ===================================

# Application Info
library.monitoring.application.name=library-service
library.monitoring.application.version=1.0.0-SNAPSHOT
library.monitoring.application.environment=development

# Metrics Configuration
library.monitoring.metrics.enabled=true
library.monitoring.metrics.prefix=library
library.monitoring.metrics.enable-search-metrics=true
library.monitoring.metrics.enable-security-metrics=true
library.monitoring.metrics.enable-rental-metrics=true

# Performance Configuration  
library.monitoring.performance.timing-enabled=true
library.monitoring.performance.slow-request-threshold-ms=1000
library.monitoring.performance.memory-tracking-enabled=true

# Spring Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Custom endpoint configuration
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Info endpoint configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Application info for /actuator/info
info.app.name=${library.monitoring.application.name}
info.app.version=${library.monitoring.application.version}
info.app.description=Library Management System with Comprehensive Monitoring
info.app.environment=${library.monitoring.application.environment}

# Async configuration for event processing
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=metrics-async-

# Logging configuration for monitoring
logging.level.org.example.library.monitoring=DEBUG
logging.level.org.springframework.boot.actuate=INFO
logging.level.io.micrometer=INFO

# Additional monitoring features
library.monitoring.alerts.enabled=true
library.monitoring.alerts.memory-threshold=0.85
library.monitoring.alerts.response-time-threshold=2000